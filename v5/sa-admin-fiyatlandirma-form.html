/* =====================================================================
   SA-ADMIN-FIYATLANDIRMA-FORM — SAYFA CSS. Plan tanımı + canlı kart önizleme.
   Form alanları VERBATIM.
   ===================================================================== */
.form-grid{display:grid;gap:18px}
.frow{display:flex;flex-direction:column;gap:7px}
.frow label{font-size:12.5px;font-weight:700;color:var(--slate-2)}
.frow .fhint{font-size:11.5px;color:var(--muted);font-weight:500}
.finput,.fselect,.ftext{width:100%;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:0 14px;height:44px;outline:none;transition:.2s var(--ease)}
.ftext{height:auto;padding:12px 14px;line-height:1.5;resize:vertical;min-height:80px}
.finput:focus,.fselect:focus,.ftext:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
.frow.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-sec{padding:18px 22px;border-bottom:1px solid var(--line)}
.form-sec:last-child{border-bottom:none}
.form-sec-tt{font-size:13px;font-weight:700;color:var(--slate);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-sec-tt i{color:var(--acc)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px}
.form-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:24px;align-items:start}

.frow-check{display:flex;align-items:center;gap:10px;padding:6px 0}
.frow-check input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);cursor:pointer;flex:none}
.frow-check label{font-size:13.5px;font-weight:500;color:var(--slate);cursor:pointer}

/* fiyat girişi ₺ ön-ek */
.cur-wrap{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;transition:.2s var(--ease)}
.cur-wrap:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
.cur-pre{display:flex;align-items:center;padding:0 14px;background:var(--bg);color:var(--slate-2);font-size:15px;font-weight:700;border-right:1px solid var(--line)}
.cur-wrap .finput{border:none;border-radius:0;box-shadow:none!important}

/* özellik satırları editörü */
.feat-edit{display:flex;flex-direction:column;gap:8px}
.feat-line{display:flex;align-items:center;gap:9px}
.feat-line input[type=checkbox]{width:17px;height:17px;accent-color:var(--green-deep);cursor:pointer;flex:none}
.feat-line .finput{flex:1;height:40px}

/* canlı plan kart önizleme (liste kartı yansıması) */
.plan-prev{background:var(--paper);border:1px solid rgba(var(--acc-rgb),.4);border-radius:var(--radius-lg);padding:20px}
.pp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pp-name{font-size:16px;font-weight:700;color:var(--slate);display:flex;align-items:center;gap:8px}
.pp-name i{color:var(--acc-deep);font-size:14px}
.pp-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-sm);background:rgba(var(--acc-rgb),.12);color:var(--acc-deep)}
.pp-price{display:flex;align-items:baseline;gap:5px;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.pp-amount{font-size:26px;font-weight:700;color:var(--slate);font-variant-numeric:tabular-nums}
.pp-per{font-size:12px;color:var(--muted);font-weight:600}
.pp-feats{display:flex;flex-direction:column;gap:7px}
.pp-feat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--slate-2)}
.pp-feat i{font-size:11px;color:var(--green-deep);flex:none}

@media(max-width:900px){.form-layout{grid-template-columns:minmax(0,1fr)}.frow.two{grid-template-columns:1fr}}
</style>
</head>

<script>
/* sayfa JS — canlı plan kart önizleme */
(function(){
  var fAd=document.getElementById('f-ad');
  var fRozet=document.getElementById('f-rozet');
  var fAylik=document.getElementById('f-aylik');
  var fFeatured=document.getElementById('f-featured');
  var featLines=document.querySelectorAll('#featEdit .feat-line');

  var ppName=document.getElementById('ppName');
  var ppTag=document.getElementById('ppTag');
  var ppAmount=document.getElementById('ppAmount');
  var ppFeats=document.getElementById('ppFeats');
  var planPrev=document.getElementById('planPrev');

  function render(){
    ppName.textContent=fAd.value||'Plan adı';
    var tag=(fRozet.value||'').trim();
    ppTag.textContent=tag||'—';
    ppTag.style.display=tag?'':'none';
    ppAmount.textContent='₺'+(parseInt(fAylik.value,10)||0);
    planPrev.style.borderColor=fFeatured.checked?'rgba(var(--acc-rgb),.4)':'var(--line)';

    ppFeats.innerHTML='';
    featLines.forEach(function(line){
      var on=line.querySelector('input[type=checkbox]').checked;
      var txt=line.querySelector('input[type=text]').value.trim();
      if(!txt)return;
      var row=document.createElement('div');
      row.className='pp-feat';
      row.innerHTML='<i class="fa-solid '+(on?'fa-check':'fa-xmark')+'" style="'+(on?'':'color:var(--line)')+'"></i> <span style="'+(on?'':'color:var(--muted)')+'">'+txt+'</span>';
      ppFeats.appendChild(row);
    });
  }

  [fAd,fRozet,fAylik,fFeatured].forEach(function(el){el.addEventListener('input',render)});
  featLines.forEach(function(line){line.querySelectorAll('input').forEach(function(i){i.addEventListener('input',render)})});

  document.getElementById('saveBtn').addEventListener('click',function(){
    if(window.saToast)saToast('Plan kaydedildi',{type:'ok'});
  });
  render();
})();
</script>
