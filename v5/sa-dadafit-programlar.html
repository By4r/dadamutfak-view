<style>
/* =====================================================================
   SA-DADAFIT-PROGRAMLAR — SAYFA CSS (kabuk CSS'i sa-shell.css'te).
   CRUD deseni: sa-dadafit-challenge liste flagship'ten uyarlandı.
   ===================================================================== */

/* Filtre çubuğu */
.filter-bar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filter-search{position:relative;flex:1;min-width:200px;max-width:320px}
.filter-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.filter-search input{width:100%;height:36px;padding:0 12px 0 34px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);outline:none;transition:.2s var(--ease)}
.filter-search input::placeholder{color:var(--muted)}
.filter-search input:focus{border-color:var(--acc);background:var(--paper);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.10)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--bg);border:1px solid var(--line);color:var(--slate-2);transition:.18s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--acc-deep)}
.chip.active{background:rgba(var(--acc-rgb),.12);border-color:var(--acc);color:var(--acc-deep)}

/* Tablo */
.ptable{width:100%;border-collapse:collapse}
.ptable thead tr{border-bottom:2px solid var(--line)}
.ptable th{padding:11px 16px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap}
.ptable tbody tr{border-bottom:1px solid var(--line);transition:background .15s}
.ptable tbody tr:last-child{border-bottom:none}
.ptable tbody tr:hover{background:var(--bg)}
.ptable td{padding:13px 16px;font-size:13.5px;vertical-align:middle}

/* Program görsel hücresi (div+bg-image — img DEĞİL) */
.pg-thumb{width:52px;height:52px;border-radius:var(--radius-sm);flex:none;background-size:cover;background-position:center;border:1px solid var(--line)}
.pg-cell{display:flex;align-items:center;gap:12px}
.pg-name{font-weight:700;color:var(--slate);font-size:13.5px;line-height:1.25}
.pg-goal{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Seviye / sayaç etiketleri */
.tag-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(var(--acc-rgb),.10);color:var(--acc-deep);white-space:nowrap}
.dur-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--slate-2)}
.dur-badge i{font-size:11px;color:var(--muted)}
.ex-count{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--slate)}
.ex-count i{font-size:12px;color:var(--muted)}

/* Aksiyon butonları (satır içi) */
.row-actions{display:flex;align-items:center;gap:6px}
.act-btn{width:32px;height:32px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--slate-2);transition:.18s var(--ease);text-decoration:none}
.act-btn:hover{border-color:var(--acc);color:var(--acc-deep);background:rgba(var(--acc-rgb),.07)}
.act-btn.danger:hover{border-color:var(--tomato);color:var(--tomato);background:var(--tomato-tint)}

/* Responsive */
@media(max-width:760px){
  .pc-body.flush{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ptable{min-width:720px}
  .filter-bar{padding:12px 16px}
}
</style>
</head>
<body data-brand="mutfak" data-sec="dadafit" data-screen="programlar">

<div class="sa-app">

    <a class="sa-rail-logo" href="sa-giris-v1.html" title="Yönetim Girişi"><img src="assets/img/logo-mark.png" alt="DadaMutfak" /></a>
    <a class="sa-rail-ico" data-sec="genel" href="sa-shell.html?sec=genel" title="Genel Bakış"><i class="fa-solid fa-gauge-high"></i></a>
    <span class="sa-rail-div"></span>
    <a class="sa-rail-ico" data-sec="admin"   href="sa-admin.html"   title="Admin"><i class="fa-solid fa-shield-halved"></i></a>
    <a class="sa-rail-ico" data-sec="saglik"  href="sa-saglik.html"  title="Sağlık &amp; Diyet"><i class="fa-solid fa-heart-pulse"></i></a>
    <a class="sa-rail-ico" data-sec="store"   href="sa-store.html"   title="DadaStore"><i class="fa-solid fa-bag-shopping"></i></a>
    <a class="sa-rail-ico" data-sec="dadafit" href="sa-dadafit.html" title="DadaFit"><i class="fa-solid fa-dumbbell"></i></a>
    <a class="sa-rail-ico" data-sec="isletme" href="sa-isletme.html" title="İşletmeler"><i class="fa-solid fa-store"></i></a>
    <a class="sa-rail-ico is-locked" data-sec="akademi" href="#" title="DadaAkademi — Yakında"><i class="fa-solid fa-graduation-cap"></i><i class="fa-solid fa-lock sr-lock"></i></a>
    <div class="sa-rail-foot"><a class="sa-rail-ico" href="anasayfa-portal-v3a.html" title="Siteye Dön"><i class="fa-solid fa-arrow-left"></i></a></div>
  </aside>

  <!-- §2 BÖLÜM MENÜSÜ (JS) -->
  <nav class="sa-menu" id="saMenu"></nav>

  <div class="sa-divider" id="saDivider" role="separator" aria-label="Menüyü daralt/genişlet" title="Sürükle veya tıkla — menüyü daralt/genişlet">
    <span class="sa-grip"><i class="fa-solid fa-grip-lines-vertical"></i></span>
  </div>

  <div class="pnl-overlay" id="pnlOverlay"></div>

  <!-- §3 ÜST BAR -->
  <header class="pnl-top">
    <button class="pnl-burger" id="pnlBurger" aria-label="Menü"><i class="fa-solid fa-bars"></i></button>
    <div class="pnl-search">
      <i class="fa-solid fa-magnifying-glass"></i>

    </div>

      <button class="pnl-bell" aria-label="Bildirimler"><i class="fa-regular fa-bell"></i><span class="pb-dot"></span></button>
      <div class="pnl-me">
        <div class="pm-ava"><i class="fa-solid fa-user"></i></div>
        <div class="pm-id">
          <div class="pm-name" id="pmName">Süper Admin</div>
          <div class="pm-role" id="pmRole">Tüm yetki</div>

    </div>
  </header>

  <!-- §4 İÇERİK — Program liste ekranı -->
  <main class="pnl-main" id="saMain">

    <!-- Sayfa başlığı -->
    <div class="pnl-page-head">
      <div>
        <h1>Programlar</h1>
        <div class="ph-sub">DadaFit antrenman programlarını yönet — hedef bazlı haftalık planlar</div>
      </div>
      <div class="ph-actions">
        <a class="btn btn-ghost btn-sm" href="#" onclick="saToast('Dışa aktarma demo');return false"><i class="fa-solid fa-arrow-down-to-line"></i> Dışa Aktar</a>
        <a class="btn btn-acc btn-sm" href="sa-dadafit-programlar-form.html"><i class="fa-solid fa-plus"></i> Yeni Program</a>
      </div>
    </div>

    <!-- Tablo kartı -->
    <div class="pnl-card">

      <!-- Filtre çubuğu -->
      <div class="filter-bar">
        <div class="filter-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="pgSearch" placeholder="Program ara…" />
        </div>
        <div class="chips" id="filterChips">
          <button class="chip active" data-filter="tümü">Tümü</button>
          <button class="chip" data-filter="kilo">Kilo Verme</button>
          <button class="chip" data-filter="kas">Kas Kazanma</button>
          <button class="chip" data-filter="dayaniklilik">Dayanıklılık</button>
          <button class="chip" data-filter="genel">Genel Form</button>
        </div>
      </div>

      <!-- Tablo -->
      <div class="pc-body flush">
        <table class="ptable" id="pgTable">
          <thead>
            <tr>
              <th style="width:36%">Program</th>
              <th style="width:14%">Seviye</th>
              <th style="width:14%">Süre</th>
              <th style="width:14%">Egzersiz</th>
              <th style="width:12%">Durum</th>
              <th style="width:10%;text-align:right">Aksiyon</th>
            </tr>
          </thead>
          <tbody id="pgTbody">
            <!-- satırlar JS ile dolduruluyor -->
          </tbody>
        </table>

        <!-- Boş durum -->
        <div class="pnl-empty" id="emptyState" style="display:none">
          <div class="pe-ico"><i class="fa-solid fa-list-check"></i></div>
          <h4>Hiç program bulunamadı</h4>
          <p>Arama kriterlerinizi değiştirin ya da ilk programı oluşturun.</p>
          <a href="sa-dadafit-programlar-form.html" class="pe-tag"><i class="fa-solid fa-plus"></i> Yeni Program</a>
        </div>
      </div>

  </main>

<script src="assets/js/sa-shell.js"></script>

<script>
/* SAYFA JS — Program liste: veri + render + filtre + arama + sil(saConfirm) */
(function(){
  var programs = [
    {id:1, ad:'Kuvvet Temelleri 8 Hafta', hedef:'Kas Kazanma', kategori:'kas', seviye:'Orta', hafta:8, egzersiz:32, durum:'aktif',
     gorsel:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200&q=80&auto=format&fit=crop'},
    {id:2, ad:'Full Body Başlangıç', hedef:'Genel Form', kategori:'genel', seviye:'Başlangıç', hafta:6, egzersiz:24, durum:'aktif',
     gorsel:'https://images.unsplash.com/photo-1518611012118-696072aa579a?w=200&q=80&auto=format&fit=crop'},
    {id:3, ad:'Yağ Yakım Sirküiti', hedef:'Kilo Verme', kategori:'kilo', seviye:'Orta', hafta:4, egzersiz:20, durum:'aktif',
     gorsel:'https://images.unsplash.com/photo-1549060279-7e168fcee0c2?w=200&q=80&auto=format&fit=crop'},
    {id:4, ad:'HIIT Dayanıklılık', hedef:'Dayanıklılık', kategori:'dayaniklilik', seviye:'İleri', hafta:6, egzersiz:28, durum:'aktif',
     gorsel:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=200&q=80&auto=format&fit=crop'},
    {id:5, ad:'Hipertrofi Push-Pull-Legs', hedef:'Kas Kazanma', kategori:'kas', seviye:'İleri', hafta:12, egzersiz:54, durum:'aktif',
     gorsel:'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=200&q=80&auto=format&fit=crop'},
    {id:6, ad:'Ev Egzersizi Programı', hedef:'Genel Form', kategori:'genel', seviye:'Başlangıç', hafta:4, egzersiz:16, durum:'taslak',
     gorsel:'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=200&q=80&auto=format&fit=crop'},
    {id:7, ad:'Maraton Hazırlık 10 Hafta', hedef:'Dayanıklılık', kategori:'dayaniklilik', seviye:'İleri', hafta:10, egzersiz:40, durum:'taslak',
     gorsel:'https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=200&q=80&auto=format&fit=crop'},
    {id:8, ad:'Yaz Diyet & Tonus', hedef:'Kilo Verme', kategori:'kilo', seviye:'Orta', hafta:8, egzersiz:30, durum:'aktif',
     gorsel:'https://images.unsplash.com/photo-1571902943202-507ec2618e8f?w=200&q=80&auto=format&fit=crop'}
  ];

  var activeFilter = 'tümü';
  var searchVal = '';

  function pstatClass(d){ return d==='aktif' ? 'ok' : (d==='taslak' ? 'wait' : 'off'); }
  function pstatLabel(d){ return d==='aktif' ? 'Aktif' : (d==='taslak' ? 'Taslak' : d); }

  function render(){
    var filtered = programs.filter(function(p){
      var matchFilter = activeFilter === 'tümü' || p.kategori === activeFilter;
      var matchSearch = !searchVal || p.ad.toLowerCase().indexOf(searchVal) !== -1
                     || p.hedef.toLowerCase().indexOf(searchVal) !== -1;
      return matchFilter && matchSearch;
    });

    var tbody = document.getElementById('pgTbody');
    var empty = document.getElementById('emptyState');
    var table = document.getElementById('pgTable');

    if(filtered.length === 0){
      table.style.display = 'none';
      empty.style.display = '';
      return;
    }
    table.style.display = '';
    empty.style.display = 'none';

    tbody.innerHTML = filtered.map(function(p){
      return '<tr>'
        + '<td><div class="pg-cell">'
        +   '<div class="pg-thumb" style="background-image:url(\'' + p.gorsel + '\')"></div>'
        +   '<div><div class="pg-name">' + p.ad + '</div><div class="pg-goal">' + p.hedef + '</div></div>'
        + '</div></td>'
        + '<td><span class="tag-pill">' + p.seviye + '</span></td>'
        + '<td><span class="dur-badge"><i class="fa-regular fa-calendar"></i> ' + p.hafta + ' hafta</span></td>'
        + '<td><span class="ex-count"><i class="fa-solid fa-dumbbell"></i> ' + p.egzersiz + '</span></td>'
        + '<td><span class="pstat ' + pstatClass(p.durum) + '">' + pstatLabel(p.durum) + '</span></td>'
        + '<td><div class="row-actions" style="justify-content:flex-end">'
        +   '<a class="act-btn" href="sa-dadafit-programlar-detay.html" title="Görüntüle"><i class="fa-solid fa-eye"></i></a>'
        +   '<a class="act-btn" href="sa-dadafit-programlar-form.html" title="Düzenle"><i class="fa-solid fa-pen"></i></a>'
        +   '<button class="act-btn danger" title="Sil" data-del="' + p.ad.replace(/"/g,'&quot;') + '"><i class="fa-solid fa-trash"></i></button>'
        + '</div></td>'
        + '</tr>';
    }).join('');
  }

  /* Chip filtre */
  document.getElementById('filterChips').addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if(!btn) return;
    document.querySelectorAll('#filterChips .chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });

  /* Arama */
  document.getElementById('pgSearch').addEventListener('input', function(e){
    searchVal = e.target.value.trim().toLowerCase();
    render();
  });

  /* Sil → saConfirm (sa-ui.js, sa-shell tarafından enjekte) */
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-del]');
    if(!btn) return;
    e.preventDefault();
    var ad = btn.dataset.del;
    saConfirm({danger:true,icon:'fa-trash',title:'Program silinsin mi?',
      message:'<b>'+ad+'</b> kalıcı olarak kaldırılacak. Programa kayıtlı kullanıcılar erişimini kaybeder.',
      ok:'Sil',onConfirm:function(){saToast(ad+' silindi')}});
  }, true);

  /* İlk render */
  render();
})();
</script>

</body>
