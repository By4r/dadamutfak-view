<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Süper Admin — DadaMutfak</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico" />
<!-- FontAwesome 6.5.2 (kilitli ikon seti) -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
/* =====================================================================
   SA-SHELL.HTML — BİRLEŞİK SÜPER ADMIN KANONİK İSKELET (OMURGA)
   panel-shell.html'in ÇİFT-SIDEBAR muadili. Site/diyetisyen chrome'u DEĞİL.
   Düzen: sol dar İKON-RAIL (56px, Slack tarzı) + orta BÖLÜM MENÜSÜ (210px,
   açık paper) + üst ince bar + içerik. Token/radius/font panel-shell ile
   BİREBİR; FARK = bölüme göre değişen --acc AKSAN-TOKEN katmanı
   (panel-shell hardcoded var(--green) kullanır; omurga GENELLEŞTİRİR).
   Rol: ?role=super|saglik-admin|store-admin|dadafit-admin|isletme-admin
   Bölüm: ?sec=genel|admin|saglik|store|dadafit|isletme|akademi
   Plan: tasks/super-admin-omurga-plan.md
   ===================================================================== */

@font-face{
  font-family:"Gilroy";
  src:url("assets/fonts/Gilroy-Medium.ttf") format("truetype");
  font-weight:500; font-style:normal; font-display:swap;
}

/* ============ KİMLİK TOKEN'LARI (brand-tokens.md — panel-shell ile BİREBİR) ============ */
:root{
  --tomato:#E14827;
  --tomato-dark:#C43D20;
  --tomato-deep:#A8331A;
  --tomato-tint:#FBE9E3;
  --slate:#211E16;
  --slate-2:#56514a;
  --green:#3BB77E;
  --green-deep:#2c9963;
  --green-tint:#E7F6EF;
  --yellow:#FAC045;
  --muted:#7E7E7E;
  --line:#ECECEC;
  --cream:#EFE5D3;
  --cream-2:#F7F1E6;
  --paper:#ffffff;
  --bg:#f9f9f9;
  --ink:#211E16;

  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px; --radius-circle:50%;
  --sh-sm:0 1px 2px rgba(33,30,22,.04), 0 2px 6px rgba(33,30,22,.05);
  --sh-md:0 6px 22px rgba(33,30,22,.09);
  --sh-lg:0 18px 50px rgba(33,30,22,.16);
  --ease:cubic-bezier(.22,.61,.36,1);

  /* çift-sidebar ölçüleri */
  --sa-rail-w:56px;
  --sa-menu-w:210px;
  --sa-side-w:266px;            /* rail + menu */
  --pnl-top-h:64px;

  /* AKSAN-TOKEN katmanı — default = Admin (domates). body[data-sec] override eder. */
  --acc:#E14827; --acc-deep:#C43D20; --acc-rgb:225,72,39;
}
/* bölüm aksanları — yeni HUE yok; kanonik palet + gölge/tint türevi (CLAUDE modül haritası) */
body[data-sec="genel"]  {--acc:#E14827;--acc-deep:#C43D20;--acc-rgb:225,72,39}   /* süper = domates */
body[data-sec="admin"]  {--acc:#E14827;--acc-deep:#C43D20;--acc-rgb:225,72,39}   /* domates */
body[data-sec="saglik"] {--acc:#3BB77E;--acc-deep:#2c9963;--acc-rgb:59,183,126}  /* nane/yeşil */
body[data-sec="store"]  {--acc:#E14827;--acc-deep:#C43D20;--acc-rgb:225,72,39}   /* domates */
body[data-sec="dadafit"]{--acc:#009d4f;--acc-deep:#007a3d;--acc-rgb:0,157,79}    /* kurumsal yeşil */
body[data-sec="isletme"]{--acc:#006072;--acc-deep:#004b59;--acc-rgb:0,96,114}    /* petrol */
body[data-sec="akademi"]{--acc:#006072;--acc-deep:#004b59;--acc-rgb:0,96,114}    /* petrol (kilitli) */

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Gilroy",system-ui,sans-serif;font-weight:500;
  color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:700;color:var(--slate);line-height:1.12;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.muted{color:var(--muted);font-weight:500}

/* btn ailesi — panel-shell mirası, accent token'lı */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;border:none;
  padding:14px 26px;border-radius:var(--radius-md);transition:.25s var(--ease);
}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:hover{background:var(--acc-deep);transform:translateY(-2px)}
.btn-ghost{background:var(--paper);color:var(--slate);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--slate);transform:translateY(-2px)}
.btn-sm{padding:10px 16px;font-size:13px;border-radius:var(--radius-sm)}

/* =====================================================================
   ÇİFT-SIDEBAR DÜZENİ — .sa-app : rail + menu + (topbar + main)
   ===================================================================== */
.sa-app{min-height:100vh}

/* ============ 1) İKON-RAIL — koyu slate, sadece ikon ============ */
.sa-rail{
  position:fixed;top:0;left:0;bottom:0;width:var(--sa-rail-w);z-index:85;
  background:var(--slate);display:flex;flex-direction:column;align-items:center;
  padding:14px 0 16px;gap:5px;
  background-image:radial-gradient(220px 200px at 50% -8%, rgba(255,255,255,.06), transparent 62%);
}
.sa-rail-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px}
.sa-rail-logo img{width:30px;height:auto}
.sa-rail-div{width:24px;height:1px;background:rgba(233,226,214,.14);margin:5px 0}
.sa-rail-ico{
  position:relative;width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;color:rgba(233,226,214,.55);font-size:17px;
  cursor:pointer;transition:.2s var(--ease);
}
.sa-rail-ico:hover{background:rgba(255,255,255,.07);color:#fff}
.sa-rail-ico.is-active{background:rgba(var(--acc-rgb),.18);color:var(--acc)}
.sa-rail-ico.is-active::before{
  content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
  background:var(--acc);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.sa-rail-ico.is-locked{color:rgba(233,226,214,.26);cursor:not-allowed}
.sa-rail-ico.is-locked:hover{background:transparent;color:rgba(233,226,214,.26)}
.sa-rail-ico .sr-lock{
  position:absolute;bottom:4px;right:5px;font-size:8px;
  color:rgba(233,226,214,.5);background:var(--slate);border-radius:50%;padding:1px;
}
.sa-rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:5px}

/* ============ 2) BÖLÜM MENÜSÜ — açık paper ============ */
.sa-menu{
  position:fixed;top:0;left:var(--sa-rail-w);bottom:0;width:var(--sa-menu-w);z-index:80;
  background:var(--paper);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.sa-menu-head{
  padding:0 18px;height:var(--pnl-top-h);flex:none;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  border-bottom:1px solid var(--line);
}
.smh-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.smh-title{font-size:16px;font-weight:800;color:var(--slate);letter-spacing:-.01em}
.sa-mnav{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.sa-msec{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.sa-mlink{
  position:relative;display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:var(--slate-2);cursor:pointer;transition:.18s var(--ease);
}
.sa-mlink i{width:18px;text-align:center;font-size:14px;color:var(--muted);transition:.18s var(--ease)}
.sa-mlink:hover{background:var(--bg);color:var(--slate)}
.sa-mlink:hover i{color:var(--acc-deep)}
.sa-mlink.is-active{background:rgba(var(--acc-rgb),.10);color:var(--acc-deep);font-weight:700}
.sa-mlink.is-active i{color:var(--acc-deep)}
.sa-mlink.is-active::before{
  content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  background:var(--acc);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.sa-mlink.is-locked{color:var(--muted);cursor:not-allowed}
.sa-mlink.is-locked:hover{background:transparent;color:var(--muted)}
.sa-mlink.is-locked i{color:var(--muted)}
.sa-mlink .pl-cnt{
  margin-left:auto;font-size:11px;font-weight:700;
  background:rgba(var(--acc-rgb),.14);color:var(--acc-deep);
  min-width:20px;height:19px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 6px;border-radius:7px;
}
.sa-mlink .ml-soon{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
.sa-menu-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sa-menu-foot .sa-mlink{font-size:13px}

/* ============ 3) ÜST İNCE BAR — panel-shell mirası, left=266 ============ */
.pnl-top{
  position:fixed;top:0;left:var(--sa-side-w);right:0;z-index:70;height:var(--pnl-top-h);
  background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 28px;
}
.pnl-burger{
  display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:var(--radius-md);
  background:var(--paper);cursor:pointer;font-size:16px;color:var(--slate);
  align-items:center;justify-content:center;flex:none;
}
.pnl-search{flex:1;max-width:420px;position:relative}
.pnl-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13.5px;color:var(--muted);pointer-events:none}
.pnl-search input{
  width:100%;height:40px;padding:0 14px 0 38px;
  font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);
  outline:none;transition:.2s var(--ease);
}
.pnl-search input::placeholder{color:var(--muted)}
.pnl-search input:focus{border-color:var(--acc);background:var(--paper);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
.pnl-top-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.pnl-bell{
  position:relative;width:40px;height:40px;border:1px solid var(--line);border-radius:var(--radius-md);
  background:var(--paper);cursor:pointer;font-size:15px;color:var(--slate);
  display:inline-flex;align-items:center;justify-content:center;transition:.2s var(--ease);
}
.pnl-bell:hover{border-color:var(--acc);color:var(--acc-deep)}
.pnl-bell .pb-dot{position:absolute;top:9px;right:10px;width:8px;height:8px;background:var(--tomato);border:2px solid var(--paper);border-radius:var(--radius-circle)}
.pnl-me{display:flex;align-items:center;gap:11px;cursor:pointer;padding:6px 8px 6px 6px;border-radius:var(--radius-md);transition:.2s var(--ease)}
.pnl-me:hover{background:var(--bg)}
.pnl-me .pm-ava{
  width:36px;height:36px;border-radius:var(--radius-circle);flex:none;
  background-size:cover;background-position:center;
  box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--acc);
}
.pnl-me .pm-id{line-height:1.25}
.pnl-me .pm-name{font-size:13.5px;font-weight:700;color:var(--slate)}
.pnl-me .pm-role{font-size:11.5px;color:var(--muted)}
.pnl-me>i{font-size:11px;color:var(--muted)}

/* ============ İÇERİK ALANI ============ */
.pnl-main{margin-left:var(--sa-side-w);padding:calc(var(--pnl-top-h) + 28px) 28px 48px;min-height:100vh}
.pnl-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.pnl-page-head h1{font-size:24px}
.pnl-page-head .ph-sub{margin-top:5px;font-size:13.5px;color:var(--muted)}
.pnl-page-head .ph-actions{display:flex;gap:10px;flex:none}

/* ============ PANEL KARTI ============ */
.pnl-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--sh-sm)}
.pc-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.pc-title{font-size:16px;font-weight:700;color:var(--slate);display:flex;align-items:center;gap:10px}
.pc-title i{color:var(--acc);font-size:15px}
.pc-link{font-size:13px;font-weight:700;color:var(--acc-deep);display:inline-flex;align-items:center;gap:7px;transition:.2s}
.pc-link i{font-size:11.5px;transition:.25s var(--ease)}
.pc-link:hover i{transform:translateX(3px)}
.pc-body{padding:22px}
.pc-body.flush{padding:0}

/* ============ KPI KARTLARI ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--sh-sm);padding:20px;display:flex;align-items:flex-start;gap:14px;transition:.25s var(--ease)}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.kpi-ico{width:44px;height:44px;flex:none;border-radius:var(--radius-md);background:rgba(var(--acc-rgb),.12);color:var(--acc-deep);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.kpi-card.warm .kpi-ico{background:var(--tomato-tint);color:var(--tomato)}
.kpi-card.sun .kpi-ico{background:#FCF3DD;color:#B8860B}
.kpi-num{font-size:26px;font-weight:700;color:var(--slate);line-height:1.05;letter-spacing:-.02em}
.kpi-lbl{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi-delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:5px}
.kpi-delta.up{color:var(--green-deep)}
.kpi-delta.down{color:var(--tomato)}
.kpi-delta.flat{color:var(--muted)}

/* ============ DURUM ROZETİ — .pstat (semantik, accent'ten BAĞIMSIZ) ============ */
.pstat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--radius-sm);white-space:nowrap}
.pstat::before{content:"";width:6px;height:6px;border-radius:var(--radius-circle);background:currentColor}
.pstat.ok{background:var(--green-tint);color:var(--green-deep)}
.pstat.wait{background:#FCF3DD;color:#B8860B}
.pstat.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pstat.warm{background:var(--tomato-tint);color:var(--tomato)}

/* ============ SON AKTİVİTE — .act-list (global dashboard) ============ */
.act-list{display:flex;flex-direction:column}
.act-row{display:flex;align-items:center;gap:13px;padding:13px 22px;border-bottom:1px solid var(--line);transition:background .15s}
.act-row:last-child{border-bottom:none}
.act-row:hover{background:var(--bg)}
.act-ico{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:14px}
.act-info{flex:1;min-width:0;line-height:1.35}
.act-info b{font-size:13.5px;color:var(--slate);font-weight:700}
.act-info span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-tag{flex:none;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px}
.act-time{flex:none;font-size:11.5px;color:var(--muted);width:46px;text-align:right}
/* bölüm renk etiketleri — kanonik hue rgba'ları (sabit, accent'ten bağımsız) */
.t-admin,.t-store{background:rgba(225,72,39,.12);color:#C43D20}
.t-saglik{background:rgba(59,183,126,.16);color:#2c9963}
.t-dadafit{background:rgba(0,157,79,.16);color:#007a3d}
.t-isletme{background:rgba(0,96,114,.14);color:#006072}

/* ============ BÖLÜM KISAYOL KARTLARI (global dash alt) ============ */
.sec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sec-card{display:flex;align-items:center;gap:13px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);transition:.22s var(--ease)}
.sec-card:hover{transform:translateY(-2px);box-shadow:var(--sh-sm);border-color:rgba(0,0,0,.12)}
.sec-card .sc-ico{width:42px;height:42px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:17px}
.sec-card .sc-tt{min-width:0;line-height:1.3}
.sec-card .sc-tt b{font-size:14px;color:var(--slate);font-weight:700;display:block}
.sec-card .sc-tt span{font-size:12px;color:var(--muted)}
.sec-card.is-locked{opacity:.6;cursor:not-allowed}
.sec-card.is-locked:hover{transform:none;box-shadow:none;border-color:var(--line)}

/* ============ BOŞ DURUM — .pnl-empty (accent token'lı) ============ */
.pnl-empty{padding:54px 24px;text-align:center}
.pnl-empty .pe-ico{width:60px;height:60px;margin:0 auto 16px;border-radius:var(--radius-md);background:rgba(var(--acc-rgb),.12);color:var(--acc-deep);display:flex;align-items:center;justify-content:center;font-size:23px}
.pnl-empty h4{font-size:16px;margin-bottom:6px}
.pnl-empty p{font-size:13px;color:var(--muted);max-width:340px;margin:0 auto 8px}
.pnl-empty .pe-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-deep);background:rgba(var(--acc-rgb),.12);padding:5px 12px;border-radius:999px;margin-top:10px}

.dash-row{margin-bottom:16px}

/* ============ MOBİL (≤980 birleşik drawer, ≤640 yoğunluk) ============ */
.pnl-overlay{position:fixed;inset:0;background:rgba(33,30,22,.5);z-index:79;opacity:0;pointer-events:none;transition:.25s}
@media(max-width:980px){
  /* rail + menü TEK birim olarak off-canvas */
  .sa-rail,.sa-menu{transform:translateX(-100%);transition:transform .28s var(--ease)}
  body.nav-open .sa-rail,body.nav-open .sa-menu{transform:translateX(0)}
  body.nav-open .pnl-overlay{opacity:1;pointer-events:auto}
  .pnl-top{left:0}
  .pnl-burger{display:inline-flex}
  .pnl-main{margin-left:0;padding:calc(var(--pnl-top-h) + 20px) 16px 40px}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .sec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pnl-me .pm-id,.pnl-me>i{display:none}
}
@media(max-width:640px){
  .pnl-search{max-width:none}
  .kpi-num{font-size:21px}
  .sec-grid{grid-template-columns:minmax(0,1fr)}
  .pc-head,.pc-body,.act-row{padding-left:16px;padding-right:16px}
  .pnl-page-head h1{font-size:20px}
  .pnl-page-head .ph-actions{display:none}
}
</style>
</head>
<body data-brand="mutfak" data-sec="genel">

<div class="sa-app">

  <!-- ============ 1) İKON-RAIL (statik; görünürlük/aktiflik JS) ============ -->
  <aside class="sa-rail" id="saRail">
    <a class="sa-rail-logo" href="anasayfa-portal-v3a.html" title="DadaMutfak">
      <img src="assets/img/logo-official-white.png" alt="DadaMutfak" />
    </a>
    <a class="sa-rail-ico" data-sec="genel" href="?sec=genel" title="Genel Bakış"><i class="fa-solid fa-gauge-high"></i></a>
    <span class="sa-rail-div"></span>
    <a class="sa-rail-ico" data-sec="admin"   href="?sec=admin"   title="Admin"><i class="fa-solid fa-shield-halved"></i></a>
    <a class="sa-rail-ico" data-sec="saglik"  href="?sec=saglik"  title="Sağlık & Diyet"><i class="fa-solid fa-heart-pulse"></i></a>
    <a class="sa-rail-ico" data-sec="store"   href="?sec=store"   title="DadaStore"><i class="fa-solid fa-bag-shopping"></i></a>
    <a class="sa-rail-ico" data-sec="dadafit" href="?sec=dadafit" title="DadaFit"><i class="fa-solid fa-dumbbell"></i></a>
    <a class="sa-rail-ico" data-sec="isletme" href="?sec=isletme" title="İşletmeler"><i class="fa-solid fa-store"></i></a>
    <a class="sa-rail-ico is-locked" data-sec="akademi" href="?sec=akademi" title="DadaAkademi — Yakında"><i class="fa-solid fa-graduation-cap"></i><i class="fa-solid fa-lock sr-lock"></i></a>
    <div class="sa-rail-foot">
      <a class="sa-rail-ico" href="anasayfa-portal-v3a.html" title="Siteye Dön"><i class="fa-solid fa-arrow-left"></i></a>
    </div>
  </aside>

  <!-- ============ 2) BÖLÜM MENÜSÜ (JS render) ============ -->
  <nav class="sa-menu" id="saMenu"><!-- JS: sa-menu-head + sa-mnav + sa-menu-foot --></nav>

  <div class="pnl-overlay" id="pnlOverlay"></div>

  <!-- ============ 3) ÜST İNCE BAR ============ -->
  <header class="pnl-top">
    <button class="pnl-burger" id="pnlBurger" aria-label="Menü"><i class="fa-solid fa-bars"></i></button>
    <div class="pnl-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Ara — kullanıcı, içerik, sipariş…" />
    </div>
    <div class="pnl-top-tools">
      <button class="pnl-bell" aria-label="Bildirimler"><i class="fa-regular fa-bell"></i><span class="pb-dot"></span></button>
      <div class="pnl-me">
        <div class="pm-ava" style="background-image:url('https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=240&q=80&auto=format&fit=crop&exp=7&gam=6&sat=-9&high=8&vib=5')"></div>
        <div class="pm-id">
          <div class="pm-name" id="pmName">Süper Admin</div>
          <div class="pm-role" id="pmRole">Tüm yetki</div>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <!-- ============ İÇERİK (JS render) ============ -->
  <main class="pnl-main" id="saMain"><!-- JS --></main>

</div>

<script>
/* =====================================================================
   OMURGA JS — config-driven render (?role= + ?sec=)
   Bölüm geçişi rail anchor'larıyla TAM SAYFA reload üzerinden olur
   (?business/?pro deseninin kardeşi); rol localStorage'da kalıcı.
   ===================================================================== */
(function(){
  var GREET = '20 Haziran 2026, Cuma';

  /* ---- BÖLÜM config ---- */
  var SECTIONS = {
    genel: { eyebrow:'Süper Admin', title:'Genel Bakış', menu:[
      {ic:'fa-gauge-high', lbl:'Genel Bakış', sec:'genel', active:true},
      {seclbl:'Bölümler'},
      {ic:'fa-shield-halved',  lbl:'Admin',          sec:'admin'},
      {ic:'fa-heart-pulse',    lbl:'Sağlık & Diyet', sec:'saglik'},
      {ic:'fa-bag-shopping',   lbl:'DadaStore',      sec:'store'},
      {ic:'fa-dumbbell',       lbl:'DadaFit',        sec:'dadafit'},
      {ic:'fa-store',          lbl:'İşletmeler',     sec:'isletme'},
      {ic:'fa-graduation-cap', lbl:'Akademi',        sec:'akademi', soon:true}
    ]},
    admin: { eyebrow:'Yönetim', title:'Admin', menu:[
      {ic:'fa-gauge-high',     lbl:'Genel Bakış', active:true},
      {ic:'fa-users-gear',     lbl:'Kullanıcılar & Yetki'},
      {ic:'fa-id-card',        lbl:'Üyeler'},
      {ic:'fa-tags',           lbl:'Fiyatlandırma & Abonelik'},
      {ic:'fa-images',         lbl:'Slider / Banner'},
      {ic:'fa-file-lines',     lbl:'Sayfalar & SEO'},
      {ic:'fa-bars-staggered', lbl:'Menü / Navigasyon'},
      {ic:'fa-sliders',        lbl:'Ayarlar'},
      {ic:'fa-chart-line',     lbl:'Raporlar'},
      {ic:'fa-award',          lbl:'Rozetler'}
    ]},
    saglik: { eyebrow:'Sağlık', title:'Sağlık & Diyet', menu:[
      {ic:'fa-gauge-high',     lbl:'Genel Bakış', active:true},
      {ic:'fa-user-doctor',    lbl:'Diyetisyenler', cnt:'4'},
      {ic:'fa-calendar-check', lbl:'Randevular'},
      {ic:'fa-clipboard-list', lbl:'Reçeteler'},
      {ic:'fa-vial',           lbl:'Testler'},
      {ic:'fa-calculator',     lbl:'Hesaplayıcılar'}
    ]},
    store: { eyebrow:'E-Ticaret', title:'DadaStore', menu:[
      {ic:'fa-gauge-high',  lbl:'Genel Bakış', active:true},
      {ic:'fa-box',         lbl:'Ürünler'},
      {ic:'fa-layer-group', lbl:'Kategoriler'},
      {ic:'fa-receipt',     lbl:'Siparişler', cnt:'7'},
      {ic:'fa-user-group',  lbl:'Müşteriler'},
      {ic:'fa-percent',     lbl:'Promosyonlar'},
      {ic:'fa-truck',       lbl:'Kargo & Ödeme'},
      {ic:'fa-chart-line',  lbl:'Raporlar'}
    ]},
    dadafit: { eyebrow:'Fitness', title:'DadaFit', menu:[
      {ic:'fa-gauge-high', lbl:'Genel Bakış', active:true},
      {ic:'fa-user-ninja', lbl:'Antrenörler', cnt:'3'},
      {ic:'fa-dumbbell',   lbl:'Egzersizler'},
      {ic:'fa-list-check', lbl:'Programlar'},
      {ic:'fa-trophy',     lbl:"Challenge'lar"}
    ]},
    isletme: { eyebrow:'İşletme', title:'İşletmeler', menu:[
      {ic:'fa-gauge-high',    lbl:'Genel Bakış', active:true},
      {ic:'fa-store',         lbl:'İşletmeler', cnt:'5'},
      {ic:'fa-calendar-day',  lbl:'Rezervasyonlar'},
      {ic:'fa-utensils',      lbl:'Menüler'},
      {ic:'fa-circle-check',  lbl:'Onaylar'},
      {ic:'fa-rectangle-ad',  lbl:'Reklam Paketleri'}
    ]},
    akademi: { eyebrow:'İçerik', title:'DadaAkademi', locked:true, menu:[] }
  };

  /* ---- ROL config ---- */
  var ROLES = {
    'super':         {name:'Süper Admin',       role:'Tüm yetki',       secs:['genel','admin','saglik','store','dadafit','isletme','akademi'], land:'genel'},
    'saglik-admin':  {name:'Sağlık Yöneticisi', role:'Sağlık & Diyet',  secs:['saglik'],  land:'saglik'},
    'store-admin':   {name:'Store Yöneticisi',  role:'E-Ticaret',       secs:['store'],   land:'store'},
    'dadafit-admin': {name:'DadaFit Yöneticisi',role:'Fitness',         secs:['dadafit'], land:'dadafit'},
    'isletme-admin': {name:'İşletme Yöneticisi',role:'İşletmeler',      secs:['isletme'], land:'isletme'}
  };

  var q = new URLSearchParams(location.search);

  /* ---- rol çöz (param > localStorage > super) ---- */
  var role = q.get('role');
  if(role){ try{localStorage.setItem('dm_sa_role', role);}catch(e){} }
  else { try{role = localStorage.getItem('dm_sa_role');}catch(e){} }
  if(!ROLES[role]) role = 'super';
  var R = ROLES[role];

  /* ---- persona ---- */
  document.getElementById('pmName').textContent = R.name;
  document.getElementById('pmRole').textContent = R.role;

  /* ---- rail görünürlük (rol) ---- */
  document.querySelectorAll('.sa-rail-ico[data-sec]').forEach(function(el){
    el.hidden = R.secs.indexOf(el.getAttribute('data-sec')) === -1;
  });

  /* ---- bölüm çöz (param > landing) + yetki guard ---- */
  var sec = q.get('sec') || R.land;
  if(R.secs.indexOf(sec) === -1) sec = R.land;     // yetki dışına elle gidişi kendi bölümüne düşür
  document.body.dataset.sec = sec;

  /* ---- rail aktif ---- */
  document.querySelectorAll('.sa-rail-ico[data-sec]').forEach(function(el){
    el.classList.toggle('is-active', el.getAttribute('data-sec') === sec);
  });

  var S = SECTIONS[sec];

  /* ---- bölüm menüsü render ---- */
  function esc(s){return s;}
  var menuHTML = '<div class="sa-menu-head"><span class="smh-eyebrow">'+S.eyebrow+'</span><span class="smh-title">'+S.title+'</span></div><div class="sa-mnav">';
  if(S.locked){
    menuHTML += '<div class="sa-msec">İçerik Yönetimi</div>'
      + '<a class="sa-mlink is-locked"><i class="fa-solid fa-lock"></i> Yakında <span class="ml-soon">Soon</span></a>';
  } else {
    S.menu.forEach(function(m){
      if(m.seclbl){ menuHTML += '<div class="sa-msec">'+m.seclbl+'</div>'; return; }
      var href = m.sec ? ('?sec='+m.sec) : '#';
      var cls = 'sa-mlink' + (m.active?' is-active':'') + (m.soon?' is-locked':'');
      var tail = m.cnt ? '<span class="pl-cnt">'+m.cnt+'</span>' : (m.soon ? '<span class="ml-soon">Yakında</span>' : '');
      menuHTML += '<a class="'+cls+'" href="'+href+'" data-soon="'+(m.soon?1:0)+'"><i class="fa-solid '+m.ic+'"></i> '+m.lbl+tail+'</a>';
    });
  }
  menuHTML += '</div><div class="sa-menu-foot">'
    + (role==='super' ? '' : '')
    + '<a class="sa-mlink" href="anasayfa-portal-v3a.html"><i class="fa-solid fa-arrow-left"></i> Siteye Dön</a>'
    + '<a class="sa-mlink" href="sa-giris-v1.html"><i class="fa-solid fa-right-from-bracket"></i> Çıkış / Rol Değiştir</a>'
    + '</div>';
  document.getElementById('saMenu').innerHTML = menuHTML;

  /* ---- içerik render ---- */
  var main;
  if(sec === 'akademi' || S.locked){
    main = lockedView(S);
  } else if(sec === 'genel'){
    main = globalDash();
  } else {
    main = sectionPlaceholder(S);
  }
  document.getElementById('saMain').innerHTML = main;

  /* ---- menü modül linkleri (href="#") tıklaması: aktif toggle, placeholder kalır ---- */
  document.getElementById('saMenu').addEventListener('click', function(e){
    var a = e.target.closest('.sa-mlink');
    if(!a) return;
    if(a.classList.contains('is-locked')){ e.preventDefault(); return; }
    if(a.getAttribute('href') === '#'){
      e.preventDefault();
      document.querySelectorAll('#saMenu .sa-mlink').forEach(function(x){x.classList.remove('is-active')});
      a.classList.add('is-active');
    }
  });

  /* ---- akademi rail kilidi: geçiş yok ---- */
  document.querySelectorAll('.sa-rail-ico.is-locked').forEach(function(el){
    el.addEventListener('click', function(e){ e.preventDefault(); });
  });

  /* =================== içerik şablonları =================== */
  function globalDash(){
    return ''
    + '<div class="pnl-page-head"><div>'
    +   '<h1>Genel Bakış</h1>'
    +   '<div class="ph-sub">'+GREET+' — platform genelinde 12 bekleyen onay ve 7 yeni sipariş var.</div>'
    + '</div><div class="ph-actions">'
    +   '<a class="btn btn-ghost btn-sm" href="#"><i class="fa-solid fa-arrow-down-to-line"></i> Rapor İndir</a>'
    + '</div></div>'
    + '<div class="kpi-grid">'
    +   kpi('warm','fa-clipboard-check','12','Bekleyen onay','down','fa-clock','4 diyetisyen · 5 işletme · 3 içerik')
    +   kpi('','fa-users','8.412','Aktif kullanıcı','up','fa-arrow-trend-up','+6% bu ay')
    +   kpi('','fa-bolt','1.337','Günlük aktivite','flat','fa-equals','son 24 saat')
    +   kpi('sun','fa-crown','₺142.500','Pro abonelik geliri','up','fa-arrow-trend-up','+18% bu ay')
    + '</div>'
    + '<div class="dash-row"><div class="pnl-card">'
    +   '<div class="pc-head"><div class="pc-title"><i class="fa-solid fa-wave-square"></i> Son Aktivite</div>'
    +     '<a class="pc-link" href="#">Tümü <i class="fa-solid fa-arrow-right"></i></a></div>'
    +   '<div class="act-list">'
    +     act('fa-user-doctor','t-saglik','Sağlık','Yeni diyetisyen başvurusu','Dyt. Ayça Yıldız — onay bekliyor','12 dk')
    +     act('fa-receipt','t-store','Store','Yeni sipariş #DS-2041','Selin K. · ₺640 · 3 ürün','28 dk')
    +     act('fa-store','t-isletme','İşletme','Yeni işletme kaydı','Köşe Mutfağı — belge doğrulaması bekliyor','1 sa')
    +     act('fa-trophy','t-dadafit','DadaFit','Challenge katılımı arttı','Haziran Challenge — 1.204 katılımcı','2 sa')
    +     act('fa-flag','t-admin','Admin','İçerik şikayeti bildirildi','“Mercimek Köftesi” yorumu — inceleme','3 sa')
    +   '</div>'
    + '</div></div>'
    + '<div class="dash-row"><div class="pnl-card">'
    +   '<div class="pc-head"><div class="pc-title"><i class="fa-solid fa-grip"></i> Bölümler</div></div>'
    +   '<div class="pc-body"><div class="sec-grid">'
    +     secCard('admin','fa-shield-halved','t-admin','Admin','Kullanıcı, içerik, ayarlar')
    +     secCard('saglik','fa-heart-pulse','t-saglik','Sağlık & Diyet','Diyetisyen, randevu, test')
    +     secCard('store','fa-bag-shopping','t-store','DadaStore','Ürün, sipariş, kargo')
    +     secCard('dadafit','fa-dumbbell','t-dadafit','DadaFit','Antrenör, program, challenge')
    +     secCard('isletme','fa-store','t-isletme','İşletmeler','Mekan, rezervasyon, menü')
    +     secCardLocked('fa-graduation-cap','DadaAkademi','İçerik & bilgi bankası — yakında')
    +   '</div></div>'
    + '</div></div>';
  }

  function sectionPlaceholder(S){
    return ''
    + '<div class="pnl-page-head"><div>'
    +   '<h1>'+S.title+'</h1>'
    +   '<div class="ph-sub">'+S.eyebrow+' yönetimi — bu bölümün ekranları sonraki dalgada eklenecek.</div>'
    + '</div></div>'
    + '<div class="pnl-card"><div class="pnl-empty">'
    +   '<div class="pe-ico"><i class="fa-solid fa-screwdriver-wrench"></i></div>'
    +   '<h4>'+S.title+' modülleri yapım aşamında</h4>'
    +   '<p>Soldaki menüde bu bölümün modül başlıkları görünüyor. Yönetim ekranları (liste / form / detay) bir sonraki paralel dalgada bağlanacak.</p>'
    +   '<span class="pe-tag"><i class="fa-solid fa-layer-group"></i> Omurga · çift-sidebar aktif</span>'
    + '</div></div>';
  }

  function lockedView(S){
    return ''
    + '<div class="pnl-page-head"><div>'
    +   '<h1>'+S.title+'</h1>'
    +   '<div class="ph-sub">'+S.eyebrow+' yönetimi henüz açık değil.</div>'
    + '</div></div>'
    + '<div class="pnl-card"><div class="pnl-empty">'
    +   '<div class="pe-ico"><i class="fa-solid fa-lock"></i></div>'
    +   '<h4>DadaAkademi yakında</h4>'
    +   '<p>İçerik &amp; bilgi bankası yönetimi (tarif, sözlük, püf noktaları, mutfağa giriş, ramazan menüleri) bu sürümde kilitli.</p>'
    +   '<span class="pe-tag"><i class="fa-solid fa-clock"></i> Yakında</span>'
    + '</div></div>';
  }

  /* yardımcılar */
  function kpi(mod,ic,num,lbl,dir,dic,delta){
    return '<div class="kpi-card '+mod+'"><div class="kpi-ico"><i class="fa-solid '+ic+'"></i></div>'
      + '<div><div class="kpi-num">'+num+'</div><div class="kpi-lbl">'+lbl+'</div>'
      + '<div class="kpi-delta '+dir+'"><i class="fa-solid '+dic+'"></i> '+delta+'</div></div></div>';
  }
  function act(ic,tag,tagl,title,sub,time){
    return '<div class="act-row"><div class="act-ico '+tag+'"><i class="fa-solid '+ic+'"></i></div>'
      + '<div class="act-info"><b>'+title+'</b><span>'+sub+'</span></div>'
      + '<span class="act-tag '+tag+'">'+tagl+'</span><span class="act-time">'+time+'</span></div>';
  }
  function secCard(sec,ic,tag,title,sub){
    return '<a class="sec-card" href="?sec='+sec+'"><div class="sc-ico '+tag+'"><i class="fa-solid '+ic+'"></i></div>'
      + '<div class="sc-tt"><b>'+title+'</b><span>'+sub+'</span></div></a>';
  }
  function secCardLocked(ic,title,sub){
    return '<div class="sec-card is-locked"><div class="sc-ico t-isletme" style="background:var(--bg);color:var(--muted)"><i class="fa-solid '+ic+'"></i></div>'
      + '<div class="sc-tt"><b>'+title+' <i class="fa-solid fa-lock" style="font-size:10px;color:var(--muted)"></i></b><span>'+sub+'</span></div></div>';
  }
})();

/* ---- mobil drawer (panel-shell deseni birebir) ---- */
(function(){
  var burger=document.getElementById('pnlBurger'), overlay=document.getElementById('pnlOverlay');
  if(burger) burger.addEventListener('click',function(){document.body.classList.toggle('nav-open')});
  if(overlay) overlay.addEventListener('click',function(){document.body.classList.remove('nav-open')});
  var q=new URLSearchParams(location.search);
  if(q.get('nav')==='1') document.body.classList.add('nav-open');
})();
</script>
</body>
</html>
