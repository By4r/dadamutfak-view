<style>
/* =====================================================================
   SA-DADAFIT-CHALLENGE — SAYFA CSS (kabuk CSS'i sa-shell.css'te).
   ===================================================================== */

/* Filtre çubuğu */
.filter-bar{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.filter-search{
  position:relative;flex:1;min-width:200px;max-width:320px;
}
.filter-search i{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:13px;color:var(--muted);pointer-events:none;
}
.filter-search input{
  width:100%;height:36px;padding:0 12px 0 34px;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  outline:none;transition:.2s var(--ease);
}
.filter-search input::placeholder{color:var(--muted)}
.filter-search input:focus{border-color:var(--acc);background:var(--paper);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.10)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  height:32px;padding:7px 14px;border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:500;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);color:var(--slate-2);
  transition:.18s var(--ease);white-space:nowrap;
}
.chip:hover{border-color:var(--acc);color:var(--acc-deep)}
.chip.active{background:rgba(var(--acc-rgb),.12);border-color:var(--acc);color:var(--acc-deep);font-weight:700}

/* Tablo */
.ptable{width:100%;border-collapse:collapse}
.ptable thead tr{border-bottom:2px solid var(--line)}
.ptable th{
  padding:11px 16px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap;
}
.ptable tbody tr{border-bottom:1px solid var(--line);transition:background .15s}
.ptable tbody tr:last-child{border-bottom:none}
.ptable tbody tr:hover{background:var(--bg)}
.ptable td{padding:13px 16px;font-size:13.5px;vertical-align:middle}

/* Challenge görsel hücresi */
.ch-thumb{
  width:52px;height:52px;border-radius:var(--radius-sm);flex:none;
  background-size:cover;background-position:center;
  border:1px solid var(--line);
}
.ch-cell{display:flex;align-items:center;gap:12px}
.ch-name{font-weight:700;color:var(--slate);font-size:13.5px;line-height:1.25}
.ch-cat{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Aksiyon butonları (satır içi) */
.row-actions{display:flex;align-items:center;gap:6px}
.act-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;border:1px solid var(--line);
  background:var(--paper);color:var(--slate-2);transition:.18s var(--ease);
  text-decoration:none;
}
.act-btn:hover{border-color:var(--acc);color:var(--acc-deep);background:rgba(var(--acc-rgb),.07)}
.act-btn.danger:hover{border-color:var(--tomato);color:var(--tomato);background:var(--tomato-tint)}

/* Katılımcı sayısı */
.part-count{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--slate)}
.part-count i{font-size:12px;color:var(--muted)}

/* Tarih hücresi */
.date-cell{font-size:13px;color:var(--slate);white-space:nowrap}
.date-cell .date-sub{font-size:11.5px;color:var(--muted);margin-top:1px}

/* Süre badge */
.dur-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;color:var(--slate-2);
}
.dur-badge i{font-size:11px;color:var(--muted)}

/* Responsive tablo */
@media(max-width:768px){
  .ptable th:nth-child(3),.ptable td:nth-child(3),
  .ptable th:nth-child(4),.ptable td:nth-child(4){display:none}
  .filter-bar{padding:12px 16px}
}
@media(max-width:560px){
  .ptable th:nth-child(5),.ptable td:nth-child(5){display:none}
  .ch-thumb{width:40px;height:40px}
}
</style>
</head>
<body data-brand="mutfak" data-sec="dadafit" data-screen="challenge">

    <div class="sa-rail-foot"><a class="sa-rail-ico" href="anasayfa-portal-v3a.html" title="Siteye Dön"><i class="fa-solid fa-arrow-left"></i></a></div>

  <!-- §2 BÖLÜM MENÜSÜ (JS) -->
  <nav class="sa-menu" id="saMenu"></nav>

  <div class="sa-divider" id="saDivider" role="separator" aria-label="Menüyü daralt/genişlet" title="Sürükle veya tıkla — menüyü daralt/genişlet">

  </div>

  <div class="pnl-overlay" id="pnlOverlay"></div>

  <!-- §3 ÜST BAR -->
  <header class="pnl-top">
    <button class="pnl-burger" id="pnlBurger" aria-label="Menü"><i class="fa-solid fa-bars"></i></button>
    <div class="pnl-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Challenge, katılımcı ara…" />
    </div>
    <div class="pnl-top-tools">
      <button class="pnl-bell" aria-label="Bildirimler"><i class="fa-regular fa-bell"></i><span class="pb-dot"></span></button>
      <div class="pnl-me">
        <div class="pm-ava"><i class="fa-solid fa-user"></i></div>
        <div class="pm-id">
          <div class="pm-name" id="pmName">Süper Admin</div>
          <div class="pm-role" id="pmRole">Tüm yetki</div>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <!-- §4 İÇERİK — Challenge liste ekranı -->
  <main class="pnl-main" id="saMain">

    <!-- Sayfa başlığı -->
    <div class="pnl-page-head">
      <div>
        <h1>Challenge'lar</h1>
        <div class="ph-sub">DadaFit fitness challenge'larını yönet — 4 aktif, 2 yakında, 3 tamamlandı</div>
      </div>
      <div class="ph-actions">
        <a class="btn btn-ghost btn-sm" href="#"><i class="fa-solid fa-arrow-down-to-line"></i> Dışa Aktar</a>
        <a class="btn btn-acc btn-sm" href="sa-dadafit-challenge-form.html"><i class="fa-solid fa-plus"></i> Yeni Challenge</a>
      </div>
    </div>

    <!-- Tablo kartı -->
    <div class="pnl-card">

      <!-- Filtre çubuğu -->
      <div class="filter-bar">
        <div class="filter-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="challengeSearch" placeholder="Challenge ara…" />
        </div>
        <div class="chips" id="filterChips">
          <button class="chip active" data-filter="tümü">Tümü</button>
          <button class="chip" data-filter="aktif"><span style="width:6px;height:6px;border-radius:50%;background:var(--green-deep);display:inline-block"></span> Aktif</button>
          <button class="chip" data-filter="yakında"><span style="width:6px;height:6px;border-radius:50%;background:#B8860B;display:inline-block"></span> Yakında</button>
          <button class="chip" data-filter="bitti"><span style="width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block"></span> Bitti</button>
        </div>
      </div>

      <!-- Tablo (boş durum JS tarafından kaldırılır) -->
      <div class="pc-body flush">
        <table class="ptable" id="challengeTable">
          <thead>
            <tr>
              <th style="width:52%">Challenge</th>
              <th style="width:10%">Süre</th>
              <th style="width:12%">Katılımcı</th>
              <th style="width:14%">Başlangıç</th>
              <th style="width:8%">Durum</th>
              <th style="width:4%;text-align:right">Aksiyon</th>
            </tr>
          </thead>
          <tbody id="challengeTbody">
            <!-- satırlar JS ile dolduruluyor -->
          </tbody>
        </table>

        <!-- Boş durum (JS gizler/gösterir) -->
        <div class="pnl-empty" id="emptyState" style="display:none">
          <div class="pe-ico"><i class="fa-solid fa-trophy"></i></div>
          <h4>Hiç challenge bulunamadı</h4>
          <p>Arama kriterlerinizi değiştirin ya da ilk challenge'ı oluşturun.</p>
          <a href="sa-dadafit-challenge-form.html" class="pe-tag"><i class="fa-solid fa-plus"></i> Yeni Challenge</a>
        </div>
      </div>

    </div><!-- /pnl-card -->

  </main>

</div><!-- /sa-app -->

<script src="assets/js/sa-shell.js"></script>

<script>
/* SAYFA JS — Challenge liste: veri + render + filtre + arama */
(function(){
  /* Demo verisi — gerçek uygulamada API'den gelir */
  var challenges = [
    {
      id: 1,
      ad: 'Haziran Koşu Challenge',
      kategori: 'Kardiyovasküler',
      gorsel: 'https://images.unsplash.com/photo-1461897104016-0b3b00cc81ee?w=200&q=80&auto=format&fit=crop',
      sure: 30,
      katilimci: 1204,
      baslangic: '2026-06-01',
      durum: 'aktif'
    },
    {
      id: 2,
      ad: 'Çekirdek Güç 21 Gün',
      kategori: 'Core & Güç',
      gorsel: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=200&q=80&auto=format&fit=crop',
      sure: 21,
      katilimci: 876,
      baslangic: '2026-06-10',
      durum: 'aktif'
    },
    {
      id: 3,
      ad: 'Yoga & Esneklik Serisi',
      kategori: 'Esneklik',
      gorsel: 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=200&q=80&auto=format&fit=crop',
      sure: 14,
      katilimci: 542,
      baslangic: '2026-06-15',
      durum: 'aktif'
    },
    {
      id: 4,
      ad: 'Sabah Rutini 30 Gün',
      kategori: 'Full Body',
      gorsel: 'https://images.unsplash.com/photo-1518611012118-696072aa579a?w=200&q=80&auto=format&fit=crop',
      sure: 30,
      katilimci: 318,
      baslangic: '2026-06-20',
      durum: 'aktif'
    },
    {
      id: 5,
      ad: 'Temmuz Güç Programı',
      kategori: 'Güç & Dayanıklılık',
      gorsel: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200&q=80&auto=format&fit=crop',
      sure: 28,
      katilimci: 0,
      baslangic: '2026-07-01',
      durum: 'yakında'
    },
    {
      id: 6,
      ad: 'Yaz Vücut Challenge',
      kategori: 'Full Body',
      gorsel: 'https://images.unsplash.com/photo-1549060279-7e168fcee0c2?w=200&q=80&auto=format&fit=crop',
      sure: 45,
      katilimci: 0,
      baslangic: '2026-07-15',
      durum: 'yakında'
    },
    {
      id: 7,
      ad: 'Mayıs Koşu Serisi',
      kategori: 'Kardiyovasküler',
      gorsel: 'https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=200&q=80&auto=format&fit=crop',
      sure: 30,
      katilimci: 2341,
      baslangic: '2026-05-01',
      durum: 'bitti'
    },
    {
      id: 8,
      ad: 'Nisan Esneklik 14 Gün',
      kategori: 'Esneklik',
      gorsel: 'https://images.unsplash.com/photo-1506629082955-511b1aa562c8?w=200&q=80&auto=format&fit=crop',
      sure: 14,
      katilimci: 1087,
      baslangic: '2026-04-01',
      durum: 'bitti'
    },
    {
      id: 9,
      ad: 'İlkbahar Detox Challenge',
      kategori: 'Sağlık & Detoks',
      gorsel: 'https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=200&q=80&auto=format&fit=crop',
      sure: 21,
      katilimci: 763,
      baslangic: '2026-03-15',
      durum: 'bitti'
    }
  ];

  var activeFilter = 'tümü';
  var searchVal = '';

  function formatTarih(str) {
    var d = new Date(str);
    return d.toLocaleDateString('tr-TR', {day:'numeric', month:'short', year:'numeric'});
  }

  function pstatClass(durum) {
    if(durum === 'aktif')   return 'ok';
    if(durum === 'yakında') return 'wait';
    if(durum === 'bitti')   return 'off';
    return 'off';
  }

  function pstatLabel(durum) {
    if(durum === 'aktif')   return 'Aktif';
    if(durum === 'yakında') return 'Yakında';
    if(durum === 'bitti')   return 'Bitti';
    return durum;
  }

  function render() {
    var filtered = challenges.filter(function(c){
      var matchFilter = activeFilter === 'tümü' || c.durum === activeFilter;
      var matchSearch = !searchVal || c.ad.toLowerCase().indexOf(searchVal) !== -1
                     || c.kategori.toLowerCase().indexOf(searchVal) !== -1;
      return matchFilter && matchSearch;
    });

    var tbody = document.getElementById('challengeTbody');
    var empty = document.getElementById('emptyState');
    var table = document.getElementById('challengeTable');

    if(filtered.length === 0){
      table.style.display = 'none';
      empty.style.display = '';
      return;
    }
    table.style.display = '';
    empty.style.display = 'none';

    tbody.innerHTML = filtered.map(function(c){
      return '<tr>'
        + '<td><div class="ch-cell">'
        +   '<div class="ch-thumb" style="background-image:url(\'' + c.gorsel + '\')"></div>'
        +   '<div><div class="ch-name">' + c.ad + '</div><div class="ch-cat">' + c.kategori + '</div></div>'
        + '</div></td>'
        + '<td><span class="dur-badge"><i class="fa-regular fa-clock"></i> ' + c.sure + ' gün</span></td>'
        + '<td><span class="part-count"><i class="fa-solid fa-users"></i> '
        +   (c.katilimci > 0 ? c.katilimci.toLocaleString('tr-TR') : '—') + '</span></td>'
        + '<td><div class="date-cell">' + formatTarih(c.baslangic) + '</div></td>'
        + '<td><span class="pstat ' + pstatClass(c.durum) + '">' + pstatLabel(c.durum) + '</span></td>'
        + '<td><div class="row-actions" style="justify-content:flex-end">'
        +   '<a class="act-btn" href="sa-dadafit-challenge-detay.html" title="Görüntüle"><i class="fa-solid fa-eye"></i></a>'
        +   '<a class="act-btn" href="sa-dadafit-challenge-form.html" title="Düzenle"><i class="fa-solid fa-pen"></i></a>'
        +   '<button class="act-btn danger" title="Sil"><i class="fa-solid fa-trash"></i></button>'
        + '</div></td>'
        + '</tr>';
    }).join('');
  }

  /* Chip filtre */
  document.getElementById('filterChips').addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if(!btn) return;
    document.querySelectorAll('#filterChips .chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });

  /* Arama */
  document.getElementById('challengeSearch').addEventListener('input', function(e){
    searchVal = e.target.value.trim().toLowerCase();
    render();
  });

  /* İlk render */
  render();
})();
</script>

</body>
