<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DadaMutfak</title>
  <style>
    :root{ --cream:#EFE5D3; --ink:#211E16; --tomato:#E14827; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:var(--cream); color:var(--ink); }
    .card{ text-align:center; padding:40px 28px; max-width:420px; }
    .mark{ font-size:22px; font-weight:800; letter-spacing:-.02em; }
    .mark span{ color:var(--tomato); }
    .sub{ margin-top:14px; font-size:14px; line-height:1.6; color:#6b675f; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">Dada<span>Mutfak</span></div>
    <p class="sub">Bu önizleme erişime kapalıdır. Bağlantıya yalnızca davetli paylaşım üzerinden ulaşılabilir.</p>
  </div>
</body>
</html>
