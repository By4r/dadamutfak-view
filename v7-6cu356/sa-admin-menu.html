      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"

<style>
/* =====================================================================
   SA-ADMIN-MENU — SAYFA CSS. Navigasyon menü builder (EN NOVEL).
   2-pano: SOL = aktif menü AĞACI (sıralama/iç içe/görünürlük) ·
   SAĞ = kaynak havuzu + canlı navbar önizleme.
   Kanonik shell+token İÇİNDE — domates aksan, palet-dışı renk YOK.
   ===================================================================== */

/* 2-pano düzen */
.mb-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:20px;align-items:start}

/* menü seçici (üst — birden çok menü konumu) */
.mb-switch{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:4px;margin-bottom:18px;width:fit-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.mb-switch::-webkit-scrollbar{display:none}
.mb-switch .ms{font-family:inherit;font-weight:700;font-size:13px;color:var(--muted);background:transparent;border:none;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;transition:.2s var(--ease);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.mb-switch .ms:hover{color:var(--acc-deep)}
.mb-switch .ms.active{background:var(--acc);color:#fff}

/* ---- AĞAÇ ---- */
.tree-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.tree-head .th-tt{font-size:14px;font-weight:700;color:var(--slate);display:flex;align-items:center;gap:9px}
.tree-head .th-tt i{color:var(--acc)}
.tree-count{font-size:12px;color:var(--muted)}
.tree-count b{color:var(--slate-2);font-weight:700}

.tree{padding:14px}
.tree-list{display:flex;flex-direction:column;gap:8px}

/* menü düğümü satırı */
.node{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:11px 12px;transition:.18s var(--ease)}
.node:hover{border-color:rgba(var(--acc-rgb),.4);box-shadow:var(--sh-sm)}
.node.is-child{margin-left:34px;border-left:3px solid rgba(var(--acc-rgb),.32)}
.node.is-hidden{opacity:.55;background:var(--bg)}

.node-grip{width:22px;flex:none;color:var(--muted);font-size:13px;cursor:grab;text-align:center}
.node-grip:active{cursor:grabbing}
.node-ico{width:34px;height:34px;flex:none;border-radius:var(--radius-sm);background:rgba(var(--acc-rgb),.10);color:var(--acc-deep);display:grid;place-items:center;font-size:13px}
.node-id{flex:1;min-width:0;line-height:1.35}
.node-label{font-size:13.5px;font-weight:700;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-target{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.node-target::before{content:"\f0c1";font-family:"Font Awesome 6 Free";font-weight:900;font-size:8px;margin-right:5px;opacity:.6}
/* alt-menü rozeti (radius-sm KÖŞELİ) */
.node-tag{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-sm);background:rgba(var(--acc-rgb),.12);color:var(--acc-deep);flex:none}

.node-ctrl{display:flex;align-items:center;gap:4px;flex:none}
.nc-btn{width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s var(--ease)}
.nc-btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc-deep);background:rgba(var(--acc-rgb),.07)}
.nc-btn.danger:hover:not(:disabled){border-color:var(--tomato);color:var(--tomato);background:var(--tomato-tint)}
.nc-btn:disabled{opacity:.3;cursor:not-allowed}
/* görünürlük açık göstergesi */
.nc-btn.vis.on{border-color:var(--acc);color:var(--acc-deep);background:rgba(var(--acc-rgb),.08)}

/* ---- SAĞ PANO ---- */
.side-stack{display:flex;flex-direction:column;gap:18px}

/* kaynak havuzu */
.pool-list{display:flex;flex-direction:column;gap:8px;padding:14px}
.pool-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-md);transition:.16s var(--ease);cursor:pointer}
.pool-item:hover{border-color:var(--acc);background:rgba(var(--acc-rgb),.05)}
.pool-ico{width:30px;height:30px;flex:none;border-radius:var(--radius-sm);background:var(--bg);color:var(--slate-2);display:grid;place-items:center;font-size:12px}
.pool-id{flex:1;min-width:0}
.pool-id b{font-size:13px;font-weight:700;color:var(--slate);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pool-id span{font-size:11px;color:var(--muted)}
.pool-add{width:28px;height:28px;flex:none;border-radius:var(--radius-sm);background:rgba(var(--acc-rgb),.12);color:var(--acc-deep);display:grid;place-items:center;font-size:11px}

/* canlı navbar önizleme */
.nav-prev{padding:16px}
.np-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--slate);border-radius:var(--radius-md);padding:12px 14px}
.np-logo{font-size:13px;font-weight:700;color:#fff;margin-right:8px;display:flex;align-items:center;gap:7px}
.np-logo i{color:var(--acc)}
.np-link{font-size:12px;font-weight:600;color:rgba(255,255,255,.82);padding:5px 9px;border-radius:var(--radius-sm);position:relative;transition:.15s}
.np-link:hover{background:rgba(255,255,255,.1);color:#fff}
.np-link.has-sub::after{content:"\f078";font-family:"Font Awesome 6 Free";font-weight:900;font-size:8px;margin-left:5px;opacity:.7}
.np-empty{font-size:12px;color:rgba(255,255,255,.5);font-style:italic}

@media(max-width:920px){.mb-layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){
  .node{flex-wrap:wrap}
  .node.is-child{margin-left:18px}
  .node-target{display:none}
  /* kontroller dar ekranda 2. satıra düşsün (6 buton sığmıyor) */
  .node-ctrl{width:100%;justify-content:flex-end;padding-top:8px;margin-top:4px;border-top:1px solid var(--line)}
  .node-id{flex:1 1 120px}
}
</style>
</head>

<script src="assets/js/sa-ui.js"></script>
<script src="assets/js/sa-shell.js"></script>
<script>
/* =====================================================================
   MENÜ BUILDER — saf veri-odaklı render. Kanon shell+token içinde.
   Model: her menü = düz öğe dizisi; child=true → alt menü (önceki top-level'a bağlı).
   ===================================================================== */
(function(){
  /* kaynak havuzu (eklenebilir hedefler) */
  var POOL=[
    {ic:'fa-house',     lbl:'Ana Sayfa',    tgt:'/'},
    {ic:'fa-book-open', lbl:'Tarifler',     tgt:'/tarifler'},
    {ic:'fa-lightbulb', lbl:'Ne Pişirsem?', tgt:'/ne-pisirsem'},
    {ic:'fa-bag-shopping',lbl:'DadaStore',  tgt:'/store'},
    {ic:'fa-heart-pulse',lbl:'Diyetisyen', tgt:'/diyetisyen'},
    {ic:'fa-dumbbell',  lbl:'DadaFit',      tgt:'/dadafit'},
    {ic:'fa-circle-info',lbl:'Hakkımızda', tgt:'/hakkimizda'},
    {ic:'fa-envelope',  lbl:'İletişim',     tgt:'/iletisim'}
  ];

  /* başlangıç menüleri */
  var MENUS={
    header:[
      {ic:'fa-house',     lbl:'Ana Sayfa',    tgt:'/',           child:false,hidden:false},
      {ic:'fa-book-open', lbl:'Tarifler',     tgt:'/tarifler',   child:false,hidden:false},
      {ic:'fa-fire',      lbl:'Popüler',      tgt:'/tarifler/populer',child:true,hidden:false},
      {ic:'fa-clock',     lbl:'Yeni Eklenenler',tgt:'/tarifler/yeni',child:true,hidden:false},
      {ic:'fa-bag-shopping',lbl:'DadaStore',  tgt:'/store',      child:false,hidden:false},
      {ic:'fa-heart-pulse',lbl:'Diyetisyen', tgt:'/diyetisyen', child:false,hidden:false},
      {ic:'fa-envelope',  lbl:'İletişim',     tgt:'/iletisim',   child:false,hidden:true}
    ],
    footer:[
      {ic:'fa-circle-info',lbl:'Hakkımızda', tgt:'/hakkimizda', child:false,hidden:false},
      {ic:'fa-shield-halved',lbl:'Gizlilik', tgt:'/gizlilik',   child:false,hidden:false},
      {ic:'fa-file-contract',lbl:'Koşullar', tgt:'/kosullar',   child:false,hidden:false},
      {ic:'fa-envelope',  lbl:'İletişim',     tgt:'/iletisim',   child:false,hidden:false}
    ]
  };

  var current='header';
  var TITLES={header:'Üst Menü',footer:'Alt Menü'};

  var treeList=document.getElementById('treeList');
  var treeEmpty=document.getElementById('treeEmpty');
  var poolList=document.getElementById('poolList');
  var navPrev=document.getElementById('navPrev');
  var nodeCount=document.getElementById('nodeCount');
  var treeTitle=document.getElementById('treeTitle');

  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function renderTree(){
    var items=MENUS[current];
    treeTitle.textContent=TITLES[current];
    nodeCount.textContent=items.length;
    treeList.innerHTML='';
    treeEmpty.style.display=items.length?'none':'block';

    items.forEach(function(it,i){
      var prevTop=i>0&&!items[i-1].child; /* önceki öğe top-level mı (indent için) */
      var node=document.createElement('div');
      node.className='node'+(it.child?' is-child':'')+(it.hidden?' is-hidden':'');
      node.innerHTML=
        '<span class="node-grip" title="Sürükle"><i class="fa-solid fa-grip-vertical"></i></span>'+
        '<span class="node-ico"><i class="fa-solid '+it.ic+'"></i></span>'+
        '<div class="node-id"><div class="node-label">'+esc(it.lbl)+'</div><div class="node-target">'+esc(it.tgt)+'</div></div>'+
        (it.child?'<span class="node-tag">Alt menü</span>':'')+
        '<div class="node-ctrl">'+
          '<button class="nc-btn" data-act="up" title="Yukarı" '+(i===0?'disabled':'')+'><i class="fa-solid fa-chevron-up"></i></button>'+
          '<button class="nc-btn" data-act="down" title="Aşağı" '+(i===items.length-1?'disabled':'')+'><i class="fa-solid fa-chevron-down"></i></button>'+
          '<button class="nc-btn" data-act="indent" title="Alt menü yap" '+(it.child||!prevTop?'disabled':'')+'><i class="fa-solid fa-indent"></i></button>'+
          '<button class="nc-btn" data-act="outdent" title="Üst seviyeye al" '+(it.child?'':'disabled')+'><i class="fa-solid fa-outdent"></i></button>'+
          '<button class="nc-btn vis '+(it.hidden?'':'on')+'" data-act="vis" title="'+(it.hidden?'Gizli — göster':'Görünür — gizle')+'"><i class="fa-'+(it.hidden?'solid fa-eye-slash':'regular fa-eye')+'"></i></button>'+
          '<button class="nc-btn danger" data-act="del" title="Kaldır"><i class="fa-solid fa-trash"></i></button>'+
        '</div>';

      node.querySelectorAll('.nc-btn').forEach(function(btn){
        var act=btn.getAttribute('data-act');
        btn.addEventListener('click',function(){onAct(act,i)});
      });
      treeList.appendChild(node);
    });
    renderPreview();
  }

  function onAct(act,i){
    var items=MENUS[current];
    var it=items[i];
    if(act==='up'&&i>0){items.splice(i,1);items.splice(i-1,0,it);}
    else if(act==='down'&&i<items.length-1){items.splice(i,1);items.splice(i+1,0,it);}
    else if(act==='indent'){it.child=true;}
    else if(act==='outdent'){it.child=false;}
    else if(act==='vis'){it.hidden=!it.hidden;}
    else if(act==='del'){
      saConfirm({danger:true,title:'Menü öğesini kaldır',
        message:'"'+it.lbl+'" öğesi bu menüden kaldırılacak.',ok:'Kaldır',cancel:'Vazgeç',
        onConfirm:function(){items.splice(i,1);renderTree();if(window.saToast)saToast('Öğe menüden kaldırıldı',{type:'danger'})}});
      return;
    }
    renderTree();
  }

  function renderPool(){
    poolList.innerHTML='';
    POOL.forEach(function(p,i){
      var el=document.createElement('div');
      el.className='pool-item';
      el.innerHTML=
        '<span class="pool-ico"><i class="fa-solid '+p.ic+'"></i></span>'+
        '<div class="pool-id"><b>'+esc(p.lbl)+'</b><span>'+esc(p.tgt)+'</span></div>'+
        '<span class="pool-add"><i class="fa-solid fa-plus"></i></span>';
      el.addEventListener('click',function(){
        MENUS[current].push({ic:p.ic,lbl:p.lbl,tgt:p.tgt,child:false,hidden:false});
        renderTree();
        if(window.saToast)saToast('"'+p.lbl+'" menüye eklendi',{type:'ok'});
      });
      poolList.appendChild(el);
    });
  }

  function renderPreview(){
    var items=MENUS[current].filter(function(it){return !it.hidden});
    navPrev.innerHTML='<span class="np-logo"><i class="fa-solid fa-utensils"></i> DadaMutfak</span>';
    if(!items.length){navPrev.innerHTML+='<span class="np-empty">Görünür öğe yok</span>';return;}
    /* alt menüleri üstüne göster: top-level'da çocuğu varsa ok işareti */
    items.forEach(function(it,i){
      if(it.child)return; /* alt menüler bar'da ayrı link olarak değil, parent'ta ok ile */
      var hasSub=items[i+1]&&items[i+1].child;
      var a=document.createElement('span');
      a.className='np-link'+(hasSub?' has-sub':'');
      a.textContent=it.lbl;
      navPrev.appendChild(a);
    });
  }

  /* menü konumu değiştir */
  document.querySelectorAll('.mb-switch .ms').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.mb-switch .ms').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
      current=btn.getAttribute('data-menu');
      renderTree();
    });
  });

  document.getElementById('saveMenu').addEventListener('click',function(){
    if(window.saToast)saToast(TITLES[current]+' kaydedildi',{type:'ok'});
  });

  renderPool();
  renderTree();
})();
</script>
