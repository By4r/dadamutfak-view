<style>
@font-face{
  font-family:"Gilroy";
  src:url("assets/fonts/Gilroy-Medium.ttf") format("truetype");
  font-weight:500; font-style:normal; font-display:swap;
}
:root{
  --tomato:#E14827; --slate:#211E16; --muted:#7E7E7E; --line:#ECECEC;
  --green:#3BB77E; --green-deep:#2c9963; --bg:#f9f9f9; --paper:#ffffff;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
  --sh-md:0 6px 22px rgba(33,30,22,.09);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Gilroy",system-ui,sans-serif;font-weight:500;color:var(--slate);
  background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.alias-card{
  width:min(480px,100%);background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius-xl);box-shadow:var(--sh-md);padding:40px 36px;text-align:center;
}
.alias-card img{height:42px;width:auto;margin:0 auto 26px;display:block}
.alias-ico{
  width:64px;height:64px;border-radius:var(--radius-lg);background:#EAF7F0;color:var(--green-deep);
  display:grid;place-items:center;font-size:26px;margin:0 auto 18px;
}
.alias-card h1{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin-bottom:9px}
.alias-card p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.alias-go{
  display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:#fff;
  background:var(--green);padding:14px 26px;border-radius:var(--radius-md);text-decoration:none;
  transition:.25s var(--ease);
}
.alias-go:hover{background:var(--green-deep);transform:translateY(-2px)}
.alias-list{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.alias-list a{
  font-size:12.5px;font-weight:700;color:var(--slate);text-decoration:none;
  background:var(--bg);border:1px solid var(--line);padding:8px 13px;border-radius:var(--radius-sm);
  transition:.2s var(--ease);
}
.alias-list a:hover{border-color:var(--green);color:var(--green-deep)}
.alias-bar{height:4px;background:var(--line);border-radius:var(--radius-sm);overflow:hidden;margin-top:24px}
.alias-bar i{display:block;height:100%;width:0;background:var(--green);animation:fill 1.2s linear forwards}
@keyframes fill{to{width:100%}}
</style>

<body data-brand="mutfak">

<script>
/* ===== Faz3 — işletme-sahibi rolü (has-business): is-auth kardeşi =====
   ?business=1 → localStorage dm_business='1' + body.has-business ; ?business=0 → temizle.
   param yoksa localStorage'a bakılır. Adım 1 işletme linkleri (İşletmem→Panele Git,
   panel topbar account chip) body.has-business ile rol-koşullu gösterilir. */
(function(){
  /* C1 — tek auth/rol token dm_user{auth,roles[],verified,level}. Eski dm_auth/dm_business
     migrate+silinir. Kök kuralı: auth ⟹ roles "kullanici" ile başlar; isletme operatörü
     ["kullanici","isletme"]. Class additive (is-auth/has-business AYNEN) + body[data-roles]. */
  var KEY='dm_user', OK={kullanici:1,antrenor:1,diyetisyen:1,isletme:1};
  function rd(){ try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;} }
  function wr(u){ try{localStorage.setItem(KEY,JSON.stringify(u));}catch(e){} }
  var u=rd();
  if(!u){                                   // migrasyon: eski binary flag → dm_user (bir kez)
    var oa=false,ob=false;
    try{oa=localStorage.getItem('dm_auth')==='1';}catch(e){}
    try{ob=localStorage.getItem('dm_business')==='1';}catch(e){}
    if(oa||ob){ u={auth:true,roles:['kullanici'],verified:false,level:0}; if(ob)u.roles.push('isletme'); wr(u); }
  }
  try{localStorage.removeItem('dm_auth');localStorage.removeItem('dm_business');}catch(e){}  // eski anahtar temizliği
  var qs=location.search;                    // URL-param (demo/SS akışı korunur + yeni roller)
  function ens(){ if(!u)u={auth:false,roles:[],verified:false,level:0}; }
  function addR(r){ ens(); if(OK[r]&&u.roles.indexOf(r)<0)u.roles.push(r); }
  if(qs.indexOf('auth=1')>-1){ ens(); u.auth=true; }
  else if(qs.indexOf('auth=0')>-1){ u=null; try{localStorage.removeItem(KEY);}catch(e){} }
  if(qs.indexOf('business=1')>-1){ ens(); u.auth=true; addR('isletme'); }
  else if(qs.indexOf('business=0')>-1){ if(u){var bi=u.roles.indexOf('isletme'); if(bi>-1)u.roles.splice(bi,1);} }
  var rm=/[?&]role=(antrenor|diyetisyen|isletme)/.exec(qs); if(rm){ ens(); u.auth=true; addR(rm[1]); }
  if(u){
    if(qs.indexOf('verified=1')>-1)u.verified=true; else if(qs.indexOf('verified=0')>-1)u.verified=false;
    var lm=/[?&]level=(\d+)/.exec(qs); if(lm)u.level=parseInt(lm[1],10)||0;
    if(u.auth&&u.roles.indexOf('kullanici')<0)u.roles.unshift('kullanici');   // kök her zaman önde
    wr(u);
  }
  var b=document.body, authed=!!(u&&u.auth);   // DOM: eski class kanalı (additive) + data-roles
  if(authed){
    b.classList.add('is-auth');
    if(u.roles.indexOf('isletme')>-1)b.classList.add('has-business');   // C3 köprü sinyali — AYNEN
    b.setAttribute('data-roles',u.roles.join(' '));
    if(u.verified)b.setAttribute('data-verified','1');
    if(u.level)b.setAttribute('data-level',String(u.level));
  }
  var bnA=document.getElementById('bnAccount');   // M6 — bottom-nav Hesap hedefi
  if(bnA)bnA.setAttribute('href', authed?'mutfak-defteri-v1.html':'giris-v1.html');
})();
</script>
