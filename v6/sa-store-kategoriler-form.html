<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kategori Düzenle — DadaStore · Süper Admin · DadaMutfak</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico" />
<!-- FontAwesome 6.5.2 (kilitli ikon seti) -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- PAYLAŞILAN KABUK (tek kaynak) -->
<link rel="stylesheet" href="assets/css/sa-shell.css" />
<style>
/* =====================================================================
   SA-STORE-KATEGORILER-FORM — SAYFA CSS (kabuk sa-shell.css'te).
   Config CRUD formu: kategori oluştur/düzenle. Ortak form alanları AYNEN.
   Token: SADECE var(--acc)/var(--acc-deep)/rgba(var(--acc-rgb),..).
   ===================================================================== */

/* ORTAK FORM ALANLARI — tüm sa-* form/detay ekranlarında AYNEN */
.form-grid{display:grid;gap:18px}
.frow{display:flex;flex-direction:column;gap:7px}
.frow label{font-size:12.5px;font-weight:700;color:var(--slate-2)}
.frow .fhint{font-size:11.5px;color:var(--muted);font-weight:500}
.finput,.fselect,.ftext{width:100%;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:0 14px;height:44px;outline:none;transition:.2s var(--ease)}
.ftext{height:auto;padding:12px 14px;line-height:1.5;resize:vertical;min-height:96px}
.finput:focus,.fselect:focus,.ftext:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
.frow.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-sec{padding:18px 22px;border-bottom:1px solid var(--line)}
.form-sec:last-child{border-bottom:none}
.form-sec-tt{font-size:13px;font-weight:700;color:var(--slate);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-sec-tt i{color:var(--acc)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px}

/* ---- form düzeni: 2-kolon (sol içerik, sağ yan kart) ---- */
.form-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:24px;align-items:start}
@media(max-width:980px){.form-layout{grid-template-columns:1fr}}

/* ---- geri link ---- */
.back-link{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:18px;transition:.18s var(--ease)}
.back-link:hover{color:var(--slate)}
.back-link i{font-size:12px}

/* ---- ikon seçici grid ---- */
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:10px}
.icon-opt{aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);color:var(--slate-2);font-size:16px;display:grid;place-items:center;cursor:pointer;transition:.15s var(--ease)}
.icon-opt:hover{border-color:var(--acc);color:var(--acc-deep)}
.icon-opt.is-on{border-color:var(--acc);background:rgba(var(--acc-rgb),.1);color:var(--acc-deep)}

/* ---- yan kart ---- */
.side-card{position:sticky;top:calc(var(--pnl-top-h) + 28px);display:flex;flex-direction:column;gap:16px}
@media(max-width:980px){.side-card{position:static}}
.sc-field{display:flex;flex-direction:column;gap:7px}
.sc-field label{font-size:12.5px;font-weight:700;color:var(--slate-2)}

/* toggle switch */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle-row span{font-size:13.5px;color:var(--slate)}
.toggle{position:relative;width:40px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s var(--ease);cursor:pointer}
.toggle input:checked+.toggle-track{background:var(--acc)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s var(--ease);pointer-events:none}
.toggle input:checked~.toggle-thumb{left:21px}
</style>
</head>
<body data-brand="mutfak" data-sec="store" data-screen="kategoriler">

<div class="sa-app">

  <!-- §1 İKON-RAIL -->
  <aside class="sa-rail" id="saRail">
    <a class="sa-rail-logo" href="sa-giris-v1.html" title="Yönetim Girişi"><img src="assets/img/logo-mark.png" alt="DadaMutfak" /></a>
    <a class="sa-rail-ico" data-sec="genel" href="sa-shell.html?sec=genel" title="Genel Bakış"><i class="fa-solid fa-gauge-high"></i></a>
    <span class="sa-rail-div"></span>
    <a class="sa-rail-ico" data-sec="admin"   href="sa-admin.html"   title="Admin"><i class="fa-solid fa-shield-halved"></i></a>
    <a class="sa-rail-ico" data-sec="saglik"  href="sa-saglik.html"  title="Sağlık &amp; Diyet"><i class="fa-solid fa-heart-pulse"></i></a>
    <a class="sa-rail-ico" data-sec="store"   href="sa-store.html"   title="DadaStore"><i class="fa-solid fa-bag-shopping"></i></a>
    <a class="sa-rail-ico" data-sec="dadafit" href="sa-dadafit.html" title="DadaFit"><i class="fa-solid fa-dumbbell"></i></a>
    <a class="sa-rail-ico" data-sec="isletme" href="sa-isletme.html" title="İşletmeler"><i class="fa-solid fa-store"></i></a>
    <a class="sa-rail-ico is-locked" data-sec="akademi" href="#" title="DadaAkademi — Yakında"><i class="fa-solid fa-graduation-cap"></i><i class="fa-solid fa-lock sr-lock"></i></a>
    <div class="sa-rail-foot"><a class="sa-rail-ico" href="sa-giris-v1.html" title="Siteye Dön"><i class="fa-solid fa-arrow-left"></i></a></div>
  </aside>

  <!-- §2 BÖLÜM MENÜSÜ (JS render) -->
  <nav class="sa-menu" id="saMenu"></nav>

  <!-- divider grip -->
  <div class="sa-divider" id="saDivider" role="separator" aria-label="Menüyü daralt/genişlet" title="Sürükle veya tıkla — menüyü daralt/genişlet">
    <span class="sa-grip"><i class="fa-solid fa-grip-lines-vertical"></i></span>
  </div>

  <div class="pnl-overlay" id="pnlOverlay"></div>

  <!-- §3 ÜST BAR -->
  <header class="pnl-top">
    <button class="pnl-burger" id="pnlBurger" aria-label="Menü"><i class="fa-solid fa-bars"></i></button>
    <div class="pnl-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Ürün, sipariş ara…" />
    </div>
    <div class="pnl-top-tools">
      <button class="pnl-bell" aria-label="Bildirimler"><i class="fa-regular fa-bell"></i><span class="pb-dot"></span></button>
      <div class="pnl-me">
        <div class="pm-ava"><i class="fa-solid fa-user"></i></div>
        <div class="pm-id">
          <div class="pm-name" id="pmName">Süper Admin</div>
          <div class="pm-role" id="pmRole">Tüm yetki</div>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <!-- §4 İÇERİK — Kategori Formu (config CRUD) -->
  <main class="pnl-main" id="saMain">

    <a class="back-link" href="sa-store-kategoriler.html"><i class="fa-solid fa-arrow-left"></i> Kategoriler</a>

    <div class="pnl-page-head">
      <div>
        <h1>Kategori Düzenle</h1>
        <div class="ph-sub">Baharat &amp; Sos — kategori bilgilerini güncelle</div>
      </div>
    </div>

    <div class="form-layout">

      <!-- sol: ana form -->
      <div style="display:flex;flex-direction:column;gap:16px">

        <!-- temel bilgiler -->
        <div class="pnl-card">
          <div class="form-sec">
            <div class="form-sec-tt"><i class="fa-solid fa-tag"></i> Temel Bilgiler</div>
            <div class="form-grid">
              <div class="frow">
                <label>Kategori Adı</label>
                <input class="finput" type="text" value="Baharat &amp; Sos" />
              </div>
              <div class="frow two">
                <div class="frow">
                  <label>URL Slug</label>
                  <input class="finput" type="text" value="baharat-sos" style="font-family:monospace" />
                  <span class="fhint">Otomatik oluşur, düzenlenebilir</span>
                </div>
                <div class="frow">
                  <label>Üst Kategori</label>
                  <select class="fselect">
                    <option value="">— Üst Kategori (kök) —</option>
                    <option>Tahıl &amp; Kurubaklagil</option>
                    <option>Zeytinyağı &amp; Yağ</option>
                    <option>Atıştırmalık</option>
                  </select>
                </div>
              </div>
              <div class="frow">
                <label>Açıklama</label>
                <textarea class="ftext" rows="3" placeholder="Kategori açıklaması (vitrin sayfasında görünebilir)…">Geleneksel Türk mutfağının vazgeçilmez baharatları, salçaları ve sosları.</textarea>
              </div>
            </div>
          </div>

          <!-- görünüm: ikon -->
          <div class="form-sec">
            <div class="form-sec-tt"><i class="fa-solid fa-icons"></i> Kategori İkonu</div>
            <div class="icon-pick" id="iconPick">
              <div class="icon-opt is-on"><i class="fa-solid fa-mortar-pestle"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-wheat-awn"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-bottle-droplet"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-cookie-bite"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-kitchen-set"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-seedling"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-pepper-hot"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-jar"></i></div>
              <div class="icon-opt"><i class="fa-solid fa-bowl-food"></i></div>
            </div>
          </div>

          <!-- SEO -->
          <div class="form-sec">
            <div class="form-sec-tt"><i class="fa-solid fa-magnifying-glass-chart"></i> SEO</div>
            <div class="form-grid">
              <div class="frow">
                <label>Meta Başlık</label>
                <input class="finput" type="text" placeholder="Baharat &amp; Sos — DadaStore" />
              </div>
              <div class="frow">
                <label>Meta Açıklama</label>
                <textarea class="ftext" rows="2" placeholder="Arama sonuçlarında görünecek açıklama…"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- form aksiyonları -->
        <div class="pnl-card">
          <div class="form-actions">
            <a class="btn btn-ghost btn-sm" href="sa-store-kategoriler.html">İptal</a>
            <button class="btn btn-acc btn-sm" onclick="catSave(event)"><i class="fa-solid fa-check"></i> Kaydet</button>
          </div>
        </div>

      </div>

      <!-- sağ: yan kart -->
      <div class="side-card">

        <!-- yayın durumu -->
        <div class="pnl-card">
          <div class="pc-head"><div class="pc-title"><i class="fa-solid fa-circle-dot"></i> Yayın Durumu</div></div>
          <div class="pc-body">
            <div style="display:flex;flex-direction:column;gap:14px">
              <div class="sc-field">
                <label>Durum</label>
                <select class="fselect">
                  <option value="aktif" selected>Aktif</option>
                  <option value="pasif">Pasif</option>
                </select>
              </div>
              <div class="toggle-row">
                <span>Menüde Göster</span>
                <label class="toggle">
                  <input type="checkbox" checked />
                  <div class="toggle-track"></div>
                  <div class="toggle-thumb"></div>
                </label>
              </div>
              <div class="toggle-row">
                <span>Vitrinde Öne Çıkar</span>
                <label class="toggle">
                  <input type="checkbox" />
                  <div class="toggle-track"></div>
                  <div class="toggle-thumb"></div>
                </label>
              </div>
              <div class="sc-field">
                <label>Sıralama</label>
                <input class="finput" type="number" value="1" />
                <span class="fhint">Düşük sayı önce gösterilir</span>
              </div>
            </div>
          </div>
        </div>

        <!-- özet -->
        <div class="pnl-card">
          <div class="pc-head"><div class="pc-title"><i class="fa-solid fa-circle-info"></i> Özet</div></div>
          <div class="pc-body" style="font-size:13px;color:var(--slate-2);line-height:1.8">
            <div style="display:flex;justify-content:space-between"><span>Toplam ürün</span><b style="color:var(--slate)">14</b></div>
            <div style="display:flex;justify-content:space-between"><span>Alt kategori</span><b style="color:var(--slate)">4</b></div>
            <div style="display:flex;justify-content:space-between"><span>Oluşturulma</span><b style="color:var(--slate)">12 Şub 2026</b></div>
          </div>
        </div>

      </div>
    </div>

  </main>

</div>

<script src="assets/js/sa-shell.js"></script>

<!-- İkon seçici + kaydet (sayfa-özel). saToast = sa-ui.js global. -->
<script>
document.querySelectorAll('#iconPick .icon-opt').forEach(function(o){
  o.addEventListener('click', function(){
    document.querySelectorAll('#iconPick .icon-opt').forEach(function(x){ x.classList.remove('is-on'); });
    o.classList.add('is-on');
  });
});
function catSave(e){
  e.preventDefault();
  saToast('Kategori kaydedildi.', {type:'ok'});
}
</script>
</body>
</html>
